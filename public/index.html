<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>왕가네 메모</title>
    <style>
      :root { --bg: #fafaf9; --fg: #1c1917; --muted: #57534e; --line: #e7e5e4; --accent: #f7941d; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0c0a09; --fg: #fafaf9; --muted: #a8a29e; --line: #292524; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
        background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { width: 100%; max-width: 480px; border: 1px solid var(--line); border-radius: 12px; padding: 32px; }
      .tag { display: inline-block; font-size: 13px; font-weight: 700; color: #0a0a0a; background: var(--accent);
        border-radius: 999px; padding: 2px 10px; }
      h1 { margin: 12px 0 4px; font-size: 26px; }
      p { margin: 0; color: var(--muted); line-height: 1.6; }
      dl { margin: 24px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; }
      dt { color: var(--muted); }
      dd { margin: 0; font-family: ui-monospace, monospace; text-align: right; }
      small { display: block; margin-top: 20px; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <span class="tag">배포 완료</span>
      <h1>왕가네 메모</h1>
      <p>학생이 과제로 만든 작은 Node 서버예요.</p>
      <dl>
        <dt>서버 시각</dt><dd id="time">불러오는 중…</dd>
        <dt>켜진 지</dt><dd id="uptime">-</dd>
        <dt>방문 수</dt><dd id="visits">-</dd>
        <dt>비밀값 설정됨</dt><dd id="key">-</dd>
      </dl>
      <small>방문 수는 서버 메모리에만 있어 다시 시작하면 0이 돼요. 비밀값은 들어 있는지만 보여 주고 값은 보여 주지 않아요.</small>
    </main>
    <script>
      async function load() {
        try {
          const info = await (await fetch('/api/info')).json()
          document.getElementById('time').textContent = new Date(info.time).toLocaleString('ko-KR')
          document.getElementById('uptime').textContent = info.uptimeSeconds + '초'
          document.getElementById('visits').textContent = info.visits + '번'
          document.getElementById('key').textContent = info.hasApiKey ? '예' : '아니요'
        } catch {
          document.getElementById('time').textContent = '서버에 닿지 못했어요'
        }
      }
      load()
      setInterval(load, 5000)
    </script>
  </body>
</html>
